apiVersion: v1
kind: Namespace
metadata:
  name: peer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-test
  namespace: peer

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-test-role
  namespace: peer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-test-rolebinding
  namespace: peer
subjects:
  - kind: ServiceAccount
    name: hub-test
    namespace: peer
roleRef:
  kind: Role
  name: hub-test-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-test
  namespace: peer
data:
  ADBTEST_WATCH: "true"
  ADBTEST_HTTP_ADDR: ":8080"
  ADBTEST_DB: "/data/reports/hub-test.db"
  ADBTEST_APK: "/data/apk/ApiDemos-debug.apk"
  ADBTEST_HUB_NAMESPACE: "peer"
  ADBTEST_HUB_NS_SERVICE: "hub-test"
  ADBTEST_HUB_URL: "http://hub-server.peer.svc.cluster.local:8080"
  TEST_IMAGE: "docker-registry.x5.ru/rrawwwrrr/hub-test-android:fix"
  IOS_TEST_IMAGE: "docker-registry.x5.ru/rrawwwrrr/hub-test-ios:fix"
  APPIUM_IMAGE: "dhub.rnd.lanit.ru/appium/appium:latest"
  IOS_APPIUM_IMAGE: "dhub.rnd.lanit.ru/appium:xcuit"
  ADBTEST_HUB_CLIENT_IMAGE: "harbor.rnd.lanit.ru/public/hub-client:fix"
  ADBTEST_HUB_USBMUXD_HOST: "hub-server.peer.svc.cluster.local"
  ADBTEST_HUB_USBMUXD_PORT: "27015"
  ADBTEST_HUB_HANDSHAKE_SECRET: "changeme"
  IOS_IPA_URL: "https://nexus.rnd.lanit.ru/repository/share/testapp2.ipa"
  IOS_BUNDLE_ID: "lanit.testapp"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hub-test-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /data/hub-test
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-test-data
  namespace: peer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-test
  namespace: peer
  labels:
    app: hub-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub-test
  template:
    metadata:
      labels:
        app: hub-test
    spec:
      serviceAccountName: hub-test
      imagePullSecrets:
        - name: regcred
      containers:
        - name: hub-test
          image: docker-registry.x5.ru/rrawwwrrr/hub-test:fix
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: hub-test
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hub-test-data

---
apiVersion: v1
kind: Service
metadata:
  name: hub-test
  namespace: peer
  labels:
    app: hub-test
spec:
  selector:
    app: hub-test
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
