name: Build and push Docker images

on:
  push:
    branches: [fix, main, develop]

env:
  REGISTRY: docker.io
  IMAGE_HUB_TEST: rrawwwrrr/hub-test
  IMAGE_TESTS_ANDROID: rrawwwrrr/hub-test-android
  IMAGE_TESTS_IOS: rrawwwrrr/hub-test-ios

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push hub-test (orchestrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_HUB_TEST }}:fix3,${{ env.IMAGE_HUB_TEST }}:latest

      - name: Build and push hub-test-tests (Android)
        uses: docker/build-push-action@v6
        with:
          context: tests
          file: tests/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TESTS_ANDROID }}:fix3,${{ env.IMAGE_TESTS_ANDROID }}:latest

      - name: Build and push hub-test-tests-ios
        uses: docker/build-push-action@v6
        with:
          context: tests-ios
          file: tests-ios/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TESTS_IOS }}:fix3,${{ env.IMAGE_TESTS_IOS }}:latest
